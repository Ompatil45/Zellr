# Copy to EC2 as /etc/nginx/sites-available/zellr
# Then: sudo ln -s /etc/nginx/sites-available/zellr /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Local hostnames:
#   zellr.localhost          → web :3000
#   api.zellr.localhost      → upload-service :4000
#   *.zellr.localhost        → request-handler :3001

server {
    listen 80;
    server_name zellr.localhost;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.zellr.localhost;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ~^(?<sub>.+)\.zellr\.localhost$;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
