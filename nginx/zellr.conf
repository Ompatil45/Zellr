# Copy to EC2 as /etc/nginx/sites-available/zellr
# Then: sudo ln -s /etc/nginx/sites-available/zellr /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Hostnames (portfolio nikhilwho.in stays untouched):
#   zellr.nikhilwho.in          → web :3000
#   api.zellr.nikhilwho.in      → upload-service :4000
#   *.zellr.nikhilwho.in        → request-handler :3001

server {
    listen 80;
    server_name zellr.nikhilwho.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.zellr.nikhilwho.in;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ~^(?<sub>.+)\.zellr\.nikhilwho\.in$;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
